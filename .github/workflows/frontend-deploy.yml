name: Deploy Frontend to Netlify

on:
  push:
    branches: [ main ]
    paths:
      - "frontend/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install (clean, reproducible)
        run: npm ci

      - name: Build
        run: npm run build

      # Pin the Netlify action version instead of 'master'
      - name: Deploy to Netlify (prod)
        uses: netlify/actions/cli@v4
        with:
          args: deploy --dir=./frontend/dist --prod
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
